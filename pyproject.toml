[project]
name = "tsuduri-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HiroItozzz", email = "mobiiii24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.8.0",
    "httpx2>=2.13.1",
    "mcp>=2.2.0",
    "pydantic-ai-slim[google]>=2.51.0",
]

[project.scripts]
tsuduri-mcp = "tsuduri_mcp.server:main"
tsuduri-import = "tsuduri_mcp.importer:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["claude_export", "test_draft", "test_post_blog_article"]

[tool.pytest.ini_options]
filterwarnings = [
    # google-genai 内部の Python 3.17 向けの非推奨警告。こちらのコードの問題ではない
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]
