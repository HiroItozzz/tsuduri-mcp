[project]
name = "tsuduri-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HiroItozzz", email = "mobiiii24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0",
]

[project.scripts]
tsuduri-mcp = "tsuduri_mcp.server:main"
tsuduri-import = "tsuduri_mcp.importer:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["claude_export"]
